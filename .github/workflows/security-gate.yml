name: Premium Security Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Block tracked environment secrets
        run: |
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.|[^/]*$)' | grep -vE '(^|/)\.env\.(example|sample|template)$|(^|/)example\.env$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "::error::Tracked environment files are not allowed."
            echo "$tracked_env"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm audit --audit-level=high
      - run: npm run build --if-present
      - run: npm run vercel-build --if-present
